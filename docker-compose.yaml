services:
  db:
    container_name: postgres_container
    image: postgres:14.22
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-db_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-db_user} -d ${POSTGRES_DB:-db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - my-network

  af:
    container_name: airflow_container
    image: apache/airflow:3.2.1
    ports:
      - 8000:8080
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Pipeline configuration — WEATHER_USE_MOCK=true runs the whole DAG
      # offline, so the stack is demonstrable without an API key.
      WEATHER_USE_MOCK: ${WEATHER_USE_MOCK:-true}
      WEATHERSTACK_API_KEY: ${WEATHERSTACK_API_KEY:-}
      WEATHERSTACK_QUERY: ${WEATHERSTACK_QUERY:-New York}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-db_password}
      PIP_ADDITIONAL_REQUIREMENTS: "dbt-postgres==1.8.2 psycopg2-binary requests"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      # The whole project is mounted so the DAG can import the loader modules
      # and run dbt against the models in this repository.
      - .:/opt/airflow/project
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my-network
    command: >
      bash -c "airflow db migrate && airflow standalone"

  superset:
    container_name: superset_container
    image: apache/superset:4.0.2
    ports:
      - 8088:8088
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-in-env}
      SUPERSET_LOAD_EXAMPLES: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my-network
    command: >
      bash -c "superset db upgrade &&
               superset fab create-admin --username admin --firstname Admin
                 --lastname User --email admin@example.com --password ${SUPERSET_ADMIN_PASSWORD:-admin} || true &&
               superset init &&
               superset run -h 0.0.0.0 -p 8088 --with-threads"

volumes:
  pgdata:

networks:
  my-network:
    driver: bridge
