# Credentials come from the environment so nothing secret lives in the repo.
weather:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'db') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'db_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'db_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'db') }}"
      schema: dev
      threads: 4
